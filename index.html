<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#131c39">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="吃金幣遊戲">
  <meta name="description" content="Pyxel 像素風格吃金幣遊戲：60 秒收集金幣、躲避炸彈，支援手機觸控與 PWA 安裝。">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
  <link rel="apple-touch-icon" href="./icons/icon-192.png">
  <title>Coin Dash｜Pyxel 吃金幣 PWA</title>
  <style>
    :root { color-scheme: dark; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #0c1430; color: #e8edf9; }
    body { overscroll-behavior: none; touch-action: manipulation; }
    .app { min-height: 100dvh; display: flex; flex-direction: column; align-items: center;
           padding: max(10px, env(safe-area-inset-top)) max(12px, env(safe-area-inset-right))
                    max(8px, env(safe-area-inset-bottom)) max(12px, env(safe-area-inset-left)); }
    header { width: min(100%, 1040px); display:flex; justify-content:space-between; align-items:center; gap:12px; margin: 0 auto 6px; }
    .branding { display:flex; align-items:center; gap:10px; min-width:0; }
    .branding img { width:34px; height:34px; image-rendering:pixelated; border-radius:8px; }
    h1 { font-size: 17px; line-height:1.2; margin:0; font-weight:750; letter-spacing:.2px; }
    .subtitle { font-size:11px; margin-top:3px; color:#9baace; }
    .actions { display:flex; align-items:center; gap:7px; }
    button { background:#f8bb34; color:#1b1c27; border:0; font-weight:750; border-radius:9px;
             padding:9px 12px; font-size:12px; white-space:nowrap; cursor:pointer; }
    button.secondary { color: #e8edf9; background:#2b3d68; }
    main { flex: 1; min-height: 0; display:flex; flex-direction:column; align-items:center; justify-content:center; width:100%; }
    #pyxel-screen { width:min(100%, 960px); height:min(70dvh, 680px); min-height:220px;
                    position:relative; touch-action:none; margin:0 auto; }
    pyxel-run { display:block; }
    .hint { font-size: 12px; text-align:center; color:#adc1e0; line-height:1.4; padding:5px 0 0; margin:0; }
    .hint strong { color:#ffd467; }
    #message { display:none; width:min(90%,560px); background:#202f53; border:1px solid #596b8d;
               border-radius:10px; padding:12px; margin:8px auto; font-size:13px; line-height:1.65; }
    #message.show { display:block; }
    @media (orientation:landscape) and (max-height:520px) {
      .app { padding-top:3px; padding-bottom:3px; }
      header { margin-bottom:0; }
      .branding img { width:25px; height:25px; }
      h1 { font-size:13px; }
      .subtitle, .hint { display:none; }
      button { padding:5px 9px; font-size:11px; }
      #pyxel-screen { height:calc(100dvh - 38px); min-height:120px; }
    }
    @media (max-width:600px) and (orientation:portrait) {
      #pyxel-screen { height:53dvh; min-height:210px; }
      h1 { font-size:14px; }
      .subtitle { font-size:10px; }
      button { padding:8px; font-size:11px; }
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <div class="branding">
      <img src="./icons/icon-192.png" alt="吃金幣遊戲圖示" width="34" height="34">
      <div><h1>COIN DASH <span lang="zh-Hant">吃金幣</span></h1><div class="subtitle">Pyxel × 手機 PWA</div></div>
    </div>
    <div class="actions">
      <button type="button" id="installButton">安裝遊戲</button>
      <button type="button" class="secondary" id="fullscreenButton">全螢幕</button>
    </div>
  </header>
  <main>
    <div id="pyxel-screen" aria-label="Pyxel 吃金幣遊戲畫面"></div>
    <p class="hint">手機：<strong>橫向持握</strong>，左側虛擬方向鍵移動、A 開始／暫停。電腦：方向鍵／WASD 移動、空白鍵開始／暫停。</p>
    <div id="message" role="status" aria-live="polite"></div>
  </main>
  <pyxel-run root="." name="game.py" gamepad="enabled"></pyxel-run>
</div>
<script>
  (() => {
    let pendingInstall = null;
    const installButton = document.getElementById('installButton');
    const fullscreenButton = document.getElementById('fullscreenButton');
    const message = document.getElementById('message');
    const notice = (text) => {
      message.textContent = text;
      message.classList.add('show');
    };
    const alreadyInstalled = () => matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
    if (alreadyInstalled()) installButton.hidden = true;

    window.addEventListener('beforeinstallprompt', (event) => {
      event.preventDefault();
      pendingInstall = event;
    });
    window.addEventListener('appinstalled', () => {
      pendingInstall = null;
      installButton.hidden = true;
      notice('已安裝至裝置。首次啟動 Pyxel 網頁執行環境需要網路連線。');
    });
    installButton.addEventListener('click', async () => {
      if (pendingInstall) {
        const prompt = pendingInstall;
        pendingInstall = null;
        prompt.prompt();
        await prompt.userChoice;
        return;
      }
      const ios = /iPad|iPhone|iPod/.test(navigator.userAgent);
      notice(ios ? 'iPhone / iPad：請用 Safari 開啟此網站，點「分享」→「加入主畫面」→「加入」。' :
        'Android：請用 Chrome 開啟本頁，點右上角 ⋮ →「安裝應用程式」或「加到主畫面」。若未出現，請確認使用 HTTPS 網址並重新整理。');
    });
    fullscreenButton.addEventListener('click', async () => {
      if (document.fullscreenElement) {
        await document.exitFullscreen();
      } else if (document.documentElement.requestFullscreen) {
        try { await document.documentElement.requestFullscreen(); }
        catch (_) { notice('瀏覽器不允許全螢幕時，可將遊戲安裝到主畫面以使用獨立視窗。'); }
      } else {
        notice('此瀏覽器不支援網頁全螢幕；將遊戲加入主畫面，可使用獨立視窗。');
      }
    });
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js').catch(() => {}));
    }
    if (!navigator.onLine) notice('目前離線。PWA 網頁外殼可能開啟，但 Pyxel 網頁引擎需網路資源，離線遊戲不保證可啟動。');
  })();
</script>
<!-- Fixed to the Pyxel version documented by its official web integration guide. -->
<script src="https://kitao.dev/pyxel/2.9.9/pyxel.js"></script>
</body>
</html>
